<style>
:root{color-scheme:dark;--pk:#ff6ec7;--pu:#8b5cf6;--gl:rgba(24,12,48,.58);--bd:rgba(255,255,255,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:#1b1035;overflow:hidden;transition:background 1s}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx span{position:absolute;top:-40px;animation:fall linear infinite;opacity:.85}
#fx.up span{top:auto;bottom:-40px;animation-name:rise}

@keyframes fall{to{transform:translate(80px,110vh) rotate(540deg)}}
@keyframes rise{to{transform:translate(-30px,-110vh) rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
#app{position:relative;z-index:1;display:flex;height:100%}
#side{width:250px;background:var(--gl);backdrop-filter:blur(14px);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .3s}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.logo{padding:14px;font-size:22px;font-weight:900;background:linear-gradient(90deg,var(--pk),#7dd3fc,var(--pk));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}

.me{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--pk),var(--pu));flex:none;transition:transform .3s;box-shadow:0 0 12px rgba(255,110,199,.5)}
.av:hover{transform:rotate(-12deg) scale(1.15)}
.sec{padding:10px 14px 4px;font-size:12px;opacity:.7;letter-spacing:1px}
#users{overflow-y:auto;flex:1}
.it{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;animation:in .4s both;transition:background .2s,transform .2s}
.it:hover{background:rgba(255,255,255,.12);transform:translateX(5px)}
.it.on{background:linear-gradient(90deg,rgba(255,110,199,.4),transparent);border-left:3px solid var(--pk)}
.it .av{width:32px;height:32px;font-size:18px}
@keyframes in{from{opacity:0;transform:translateX(-20px)}}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--gl);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);font-weight:700}
#menu{display:none;background:none;padding:4px 8px;font-size:20px}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:85%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.m.mine{align-self:flex-end;flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}}
.b{padding:8px 13px;border-radius:18px 18px 18px 4px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border:1px solid var(--bd);word-wrap:break-word;min-width:0}
.mine .b{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,var(--pk),var(--pu));border:0}
.b i{display:block;font-size:11px;font-style:normal;opacity:.75;margin-bottom:2px}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--gl);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--bd);background:rgba(255,255,255,.12);color:#fff;font-size:16px;outline:none}
input:focus{border-color:var(--pk);box-shadow:0 0 10px var(--pk)}
button{padding:10px 18px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s}

.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid .av{cursor:pointer;opacity:.6}.grid .sel{opacity:1;outline:3px solid #fff;transform:scale(1.15)}
.th{padding:8px 12px;border-radius:14px;cursor:pointer;border:2px solid transparent;font-size:14px}
.th.sel{border-color:#fff;transform:scale(1.07)}

#ov{position:fixed;inset:0;z-index:9;background:#000;display:none}#ov.show{display:block}#ov img,#ov video{max-width:100%;max-height:100%}#pg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);left:8px;right:8px;height:3px;background:rgba(255,255,255,.3);z-index:2}#pgi{display:block;height:100%;width:0;background:#fff}#oh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3}.tz{position:absolute;top:70px;bottom:0;width:40%;z-index:2}
.edi{width:100%;min-width:160px;padding:4px 8px!important;font-size:14px!important}audio.med{width:230px;height:40px}.rec{background:#e11d48!important;animation:pul 1s infinite}@keyframes pul{50%{transform:scale(1.1)}}.mod{position:fixed;inset:0;z-index:8;background:rgba(10,5,25,.7);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}.mod.show{display:grid}
select{padding:10px;border-radius:12px;background:#3a2468;color:#fff;border:1px solid var(--bd);font-size:15px}.big{font-size:22px;text-align:center}
.tg{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.tg button{height:64px;font-size:28px;padding:0}

#inv{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;z-index:12;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}#iv,#nt{display:flex;flex-direction:column;gap:8px;width:min(420px,100%)}.iv{pointer-events:auto;background:#2a1850;border:2px solid var(--pk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:pop .4s both;box-shadow:0 8px 30px rgba(0,0,0,.55)}.iv>div{display:flex;gap:8px}.av{overflow:hidden}.av svg{width:100%;height:100%;display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.row button{padding:2px 10px;font-size:13px}.row>div{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}.dot{display:inline-block;width:22px;height:22px;border-radius:50%;margin:2px;cursor:pointer;border:2px solid transparent;transition:transform .2s}.dot.sel{border-color:#fff;transform:scale(1.25)}
@media(max-width:700px){#side{position:absolute;inset:0 auto 0 0;z-index:3;transform:translateX(-100%);width:78%}#side.open{transform:none}#menu{display:block}}

 <div style="width:min(420px,100%);background:#21143b;border:1px solid #8b5cf6;border-radius:20px;padding:24px;box-shadow:0 20px 70px #0009">
  <h2 style="margin:0 0 6px;color:#ff9cdd">🌸 Anime Chat</h2><p style="opacity:.8;margin:0 0 18px">Connecte-toi ou crée ton compte.</p>
  <div style="display:flex;gap:8px;margin-bottom:14px"><button id="authLoginTab">Connexion</button><button id="authSignupTab">Créer un compte</button></div>
  <label for="authName">Nom d'utilisateur</label><input id="authName" maxlength="20" autocomplete="username" placeholder="Ex. Kems" style="width:100%;margin:6px 0 12px;padding:12px;border-radius:10px">

 </div>

<script>
window.AUTH_READY=new Promise(resolve=>{
 const gate=document.getElementById('authGate'),msg=document.getElementById('authMsg'),btn=document.getElementById('authSubmit');
 let mode='login';
 const setMode=m=>{mode=m;btn.textContent=m==='login'?'Se connecter':'Créer mon compte';document.getElementById('authLoginTab').style.opacity=m==='login'?'1':'.55';document.getElementById('authSignupTab').style.opacity=m==='signup'?'1':'.55';document.getElementById('authPass').autocomplete=m==='login'?'current-password':'new-password'};
 document.getElementById('authLoginTab').onclick=()=>setMode('login');document.getElementById('authSignupTab').onclick=()=>setMode('signup');
 (async()=>{try{const session=await window.AnimeAuth.session();if(session){gate.remove();resolve();return}}catch(e){}
 setMode('login');btn.onclick=async()=>{const name=document.getElementById('authName').value.trim(),pass=document.getElementById('authPass').value;
 if(!/^[a-zA-Z0-9_]{3,20}$/.test(name)){msg.textContent='Utilise 3 à 20 caractères : lettres, chiffres ou _. ';return}
 if(pass.length<8){msg.textContent='Le mot de passe doit contenir au moins 8 caractères.';return}
 btn.disabled=true;msg.textContent='Patiente…';
 try{if(mode==='signup'&&name.toLowerCase()==='kems'){throw new Error('Le pseudo Kems est réservé à l’administrateur.')}if(mode==='signup'){await window.AnimeAuth.signUp(name,pass);msg.textContent='Compte créé ! Connexion…';await window.AnimeAuth.signIn(name,pass)}else await window.AnimeAuth.signIn(name,pass);
 gate.remove();resolve()
 }catch(e){msg.textContent=e.message||'Impossible de se connecter.'}finally{btn.disabled=false}};
 })();
});
</script>

if(g.h===uid)B.appendChild(E('button','🗑 Supprimer la partie',()=>{gcol().doc(g.id).delete().catch(()=>{})}));else B.appendChild(E('button','Masquer',()=>{gh[g.id]=1;try{localStorage.setItem('chat-gh',JSON.stringify(gh))}catch(e){}gcur=null;$('gm').classList.remove('show');gbar()}));
B.appendChild(E('button','Fermer',()=>{gcur=null;$('gm').classList.remove('show')}))}
let gprev={},gvib={};
const note=t=>{const c=E('div',t,0,'iv');$('nt').appendChild(c);setTimeout(()=>c.remove(),5000)};
async function gacc(g){
try{
const ref=gcol().doc(g.id),snap=await ref.get(),fresh=snap&&snap.data?snap.data():null;
if(!fresh||fresh.st!=='wait'||!GM[fresh.t]){alert('Cette invitation n’est plus disponible.');return}
if(fresh.to!=='all'&&fresh.to!==uid){alert('Cette invitation ne t’est pas destinée.');return}
const players=Array.isArray(fresh.pl)?fresh.pl:[];
if(players.includes(uid)){gcur=g.id;gdraw();return}
if(players.length>=GM[fresh.t].max){alert('La partie est complète.');return}
const p={pl:[...players,uid]};
if(GM[fresh.t].max===2)p.st='play';
await ref.update(p);gcur=g.id;
}catch(e){if(!String(e).includes('game_update_failed'))alert('Impossible d’accepter cette invitation. Réessaie.')}
}
async function gref(g){
if(g.to==='all'){gh[g.id]=1;try{localStorage.setItem('chat-gh',JSON.stringify(gh))}catch(e){}ginv();gbar();return}
try{
const ref=gcol().doc(g.id),snap=await ref.get(),fresh=snap&&snap.data?snap.data():null;
if(!fresh||fresh.st!=='wait'||fresh.to!==uid)return;
const declined=Array.isArray(fresh.dc)?fresh.dc:[];
if(!declined.includes(uid))await ref.update({dc:[...declined,uid]});
}catch(e){alert('Impossible d’enregistrer ton refus. Réessaie.')}
}
function ginv(){const B=$('iv');B.innerHTML='';
GL.forEach(g=>{if(!GM[g.t])return;const pv=gprev[g.id],inn=g.pl.includes(uid);
if(pv){if(inn&&pv.st==='wait'&&g.st==='play'){gcur=g.id;gdraw()}
if(g.h===uid){if(!pv.dc.includes(g.to)&&(g.dc||[]).includes(g.to))note('❌ '+nm(g.to)+' a refusé ton invitation');if(g.pl.length>pv.n&&g.st==='wait')note('✅ '+nm(g.pl[g.pl.length-1])+' a accepté : '+GM[g.t].n)}}
gprev[g.id]={st:g.st,dc:g.dc||[],n:g.pl.length};
if(g.h!==uid&&g.st==='wait'&&(g.to==='all'||g.to===uid)&&!inn&&!(g.dc||[]).includes(uid)&&!gh[g.id]&&g.pl.length<GM[g.t].max){
if(!gvib[g.id]){gvib[g.id]=1;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
const c=E('div','',0,'iv');c.appendChild(E('b','🎮 '+nm(g.h)+" t'invite à jouer : "+GM[g.t].n));const r=document.createElement('div');
r.appendChild(E('button','✅ Accepter',()=>gacc(g)));r.appendChild(E('button',g.to==='all'?'Ignorer':'❌ Refuser',()=>gref(g)));c.appendChild(r);B.appendChild(c)}})}
db.collection('games').orderBy('ts','asc').limit(60).onSnapshot(q=>{const c=Date.now()-216e5;GL=q.docs.map(d=>Object.assign({id:d.id},d.data()||{})).filter(x=>x.ts>c);gbar();ginv();if(gcur)gdraw()},()=>{});
function mkGame(t,to){if(!me){openModal();return}const d={rps:{m:{},sc:{},rd:1,res:null},ttt:{b:Array(9).fill(''),turn:uid,w:null},tod:{turn:null,q:null,k:null},num:{n:1+Math.floor(Math.random()*100),g:[],w:null}}[t];
gcol().add({t,h:uid,hn:me.name,to,pl:[uid],st:'wait',d,ts:Date.now()}).then(r=>{gcur=r.id;$('gn').classList.remove('show');setTimeout(gdraw,300)}).catch(()=>alert('Jeu non créé.'))}
$('gbtn').onclick=()=>{if(!me){openModal();return}const sel=$('gt');sel.innerHTML='';const o=document.createElement('option');o.value='all';o.textContent='👥 Tout le monde';sel.appendChild(o);
Object.keys(profs).filter(k=>k!==uid).forEach(k=>{const x=document.createElement('option');x.value=k;x.textContent='👤 '+(profs[k].name||'?');sel.appendChild(x)});if(cur&&cur!=='main'&&profs[cur])sel.value=cur;$('gn').classList.add('show')};
Object.keys(GM).forEach(t=>$('gl').appendChild(E('button',GM[t].n,()=>mkGame(t,$('gt').value))));
$('gx').onclick=()=>$('gn').classList.remove('show');
let SL=[],seenS={};try{seenS=JSON.parse(localStorage.getItem('chat-ss')||'{}')}catch(e){}
function bar(){const B=$('stories');B.innerHTML='';
const mk=(lab,inner,fn,sn)=>{const t=document.createElement('div');t.className='st'+(sn?' seen':'');const r=document.createElement('div');r.className='ring';r.appendChild(inner);t.appendChild(r);const b=document.createElement('b');b.textContent=lab;t.appendChild(b);t.onclick=fn;B.appendChild(t)};
const pl=document.createElement('div');pl.className='av';pl.textContent='＋';pl.style.fontSize='24px';mk('Ma story',pl,()=>{if(!me){openModal();return}$('fs').click()},true);
const g={};SL.forEach(x=>(g[x.uid]=g[x.uid]||[]).push(x));
Object.keys(g).sort((x,y)=>x===uid?-1:y===uid?1:0).forEach(k=>{const p=profs[k]||{};mk(k===uid?'Toi':(p.name||'?'),avEl(p.av),()=>runStories(g[k]),g[k].every(x=>seenS[x.id]))})}
function runStories(list){let i=0,tm;
const go=n=>{clearTimeout(tm);if(n<0)n=0;if(n>=list.length){closeOv();return}i=n;const x=list[i];seenS[x.id]=1;try{localStorage.setItem('chat-ss',JSON.stringify(seenS))}catch(e){}
ovc.innerHTML='';const el=media(x,true);
if(el&&el.tagName==='VIDEO'){el.controls=false;el.onended=()=>go(i+1);el.ontimeupdate=()=>{pgi.style.width=(el.currentTime/(el.duration||1)*100)+'%'};ovc.appendChild(el)}
else if(el){pgi.style.cssText='width:0;transition:none';setTimeout(()=>{pgi.style.cssText='width:100%;transition:width 5s linear'},40);tm=setTimeout(()=>go(i+1),5000);ovc.appendChild(el)}else tm=setTimeout(()=>go(i+1),400);
const p=profs[x.uid]||{};$('otx').textContent=(p.name||x.name||'')+' · '+new Date(x.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const d=$('odel');d.dataset.s='';d.textContent='🗑';d.style.display=x.uid===uid?'':'none';
d.onclick=()=>twice(d,'🗑',()=>{db.collection('stories').doc(x.id).delete().catch(()=>{});if(x.aid&&A)try{A.delete(x.aid)}catch(e){}closeOv()})};
$('pg').style.display='';$('lz').style.display=$('rz').style.display='';$('lz').onclick=()=>go(i-1);$('rz').onclick=()=>go(i+1);
ovEnd=()=>{clearTimeout(tm);bar()};ov.classList.add('show');go(0)}
db.collection('stories').orderBy('ts','asc').limit(100).onSnapshot(q=>{const c=Date.now()-864e5;SL=q.docs.map(d=>Object.assign({id:d.id},d.data()||{})).filter(x=>x.ts>c);bar()},()=>{});
$('send').onclick=send;$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
})();
